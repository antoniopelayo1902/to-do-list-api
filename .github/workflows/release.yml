name: Release (Continuous Delivery)

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Tag inválido: $TAG"; exit 1; }
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # No se publica un release que no pase las pruebas.
      - name: Run unit tests
        run: |
          pip install -r src/requirements.txt -r tests/requirements-dev.txt
          pytest -q

      - name: Package repository as zip
        run: |
          mkdir -p dist
          git archive --format=zip --output "dist/todo-list-api-${TAG}.zip" "$TAG"
          unzip -l "dist/todo-list-api-${TAG}.zip" | tail -1

      # Se usa un PAT (RELEASE_TOKEN): un release creado con GITHUB_TOKEN no dispara otros workflows,
      # y entonces deploy.yml (on: release published) nunca correría.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Falta el secret RELEASE_TOKEN (ver README)."
            exit 1
          fi
          gh release create "$TAG" "dist/todo-list-api-${TAG}.zip" \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
